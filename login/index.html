<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Hebelie</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="desk">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/"><span class="monogram" aria-hidden="true">H</span><span class="brand-text"><em>Hebelie</em><span class="brand-slogan">Studio desk</span></span></a>
    </div>
  </header>
  <main class="desk-main">
    <form id="loginForm" class="desk-login">
      <p class="kicker">Studio desk</p>
      <h1>Sign in</h1>
      <label class="field">Email
        <input name="email" type="email" autocomplete="username" required>
      </label>
      <label class="field">Password
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <p id="loginError" class="lead-error" hidden></p>
      <button class="btn-generate" type="submit">Sign in</button>
      <p class="auth-switch">New clinic? <a href="/signup/">Create an account</a></p>
    </form>
    <div id="loginOk" class="desk-login desk-success" hidden>
      <p class="kicker">Studio desk</p>
      <h1>Signed in</h1>
      <p id="loginOkText" class="lede"></p>
      <p id="loginOkMeta" class="desk-meta"></p>
      <p class="auth-switch">Your session is saved in this browser. The desk will use this login in the next step. Until then, open the <a href="/admin/">desk</a> with the existing password for leads.</p>
      <button type="button" id="signOutLocal" class="btn-ghost desk-signout">Sign out</button>
    </div>
  </main>
<script src="/login/login.js"></script>
</body>
</html>
