<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hebelie desk</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="desk">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="../"><span class="monogram" aria-hidden="true">H</span><span class="brand-text"><em>Hebelie</em><span class="brand-slogan">Studio desk</span></span></a>
      <div class="desk-user">
        <p id="who" hidden></p>
        <button type="button" id="signOut" class="btn-ghost" hidden>Sign out</button>
      </div>
    </div>
  </header>
  <main class="desk-main">
    <section id="board" hidden>
      <div class="desk-head">
        <div>
          <p class="kicker">Studio desk</p>
          <h1>Leads</h1>
        </div>
        <p id="leadCount" class="lede"></p>
      </div>
      <form id="createClinic" class="desk-card desk-create" hidden>
        <h2>New clinic</h2>
        <p class="desk-meta">Create an account for a medspa. They sign in with this email and password.</p>
        <div class="desk-create-fields">
          <label class="field">Clinic name
            <input name="clinicName" type="text" autocomplete="organization" required>
          </label>
          <label class="field">Owner email
            <input name="email" type="email" autocomplete="off" required>
          </label>
          <label class="field">Password
            <input name="password" type="password" autocomplete="new-password" minlength="8" required>
          </label>
        </div>
        <p id="createError" class="lead-error" hidden></p>
        <p id="createOk" class="desk-ok" hidden></p>
        <button class="btn-generate" type="submit">Create clinic</button>
      </form>
      <p id="boardError" class="lead-error" hidden></p>
      <div id="leadList" class="desk-list"></div>
    </section>
  </main>
<script src="../site-root.js"></script>
<script src="admin.js"></script>
</body>
</html>
