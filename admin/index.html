<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hebelie desk</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="desk">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/"><span class="monogram" aria-hidden="true">H</span><span class="brand-text"><em>Hebelie</em><span class="brand-slogan">Studio desk</span></span></a>
      <button type="button" id="signOut" class="btn-ghost" hidden>Sign out</button>
    </div>
  </header>
  <main class="desk-main">
    <form id="loginForm" class="desk-login">
      <p class="kicker">Studio desk</p>
      <h1>Leads</h1>
      <label class="field">Password
        <input id="password" type="password" autocomplete="current-password" required>
      </label>
      <p id="loginError" class="lead-error" hidden></p>
      <button class="btn-generate" type="submit">Open the desk</button>
    </form>
    <section id="board" hidden>
      <div class="desk-head">
        <div>
          <p class="kicker">Studio desk</p>
          <h1>Leads</h1>
        </div>
        <p id="leadCount" class="lede"></p>
      </div>
      <p id="boardError" class="lead-error" hidden></p>
      <div id="leadList" class="desk-list"></div>
    </section>
  </main>
<script src="/admin/admin.js"></script>
</body>
</html>
